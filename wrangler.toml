name = "alessandro-terminal"
main = "src/worker.mjs"
compatibility_date = "2026-01-01"
# private terminal (T05): no workers.dev / preview URLs that would bypass Cloudflare Access
workers_dev = false
preview_urls = false
# keep variables/secrets set in the dashboard: a deploy must never drop TWELVEDATA_KEY
keep_vars = true

# Only these two paths of the site go to this Worker; the rest of
# alessandrozanichelli.com keeps being served by the existing site.
routes = [
  { pattern = "alessandrozanichelli.com/terminal*", zone_name = "alessandrozanichelli.com" },
  { pattern = "alessandrozanichelli.com/api/*", zone_name = "alessandrozanichelli.com" }
]

# static files: /terminal/ (public landing page), /terminal/desk/ (the terminal, behind Cloudflare Access),
# /terminal/replay/player.js; the Worker reads the terminal page through ASSETS for the public replay (src/replay.mjs)
[assets]
directory = "./public"
binding = "ASSETS"

# briefing model (Cloudflare Workers AI, free allocation)
[ai]
binding = "AI"

# scheduled briefings (src/cron.mjs): every minute in these UTC hours, which contain the
# Rome slots in both CET and CEST (Daily 07:30, Weekly/Monthly Sat 08:00, Evening 22:30).
# Outside a slot's ~30 minutes a run returns at once; 300 runs a day.
# alerts (src/alerts.mjs): checked every 5 minutes, 288 runs a day. Free plan: 5 cron triggers per account.
# ETF screener returns and risk (src/etfperf.mjs): minutes 2, 12, 22 … — 8 funds a run, 144 runs and KV writes a day.
[triggers]
crons = ["* 5-7 * * *", "* 20-21 * * *", "*/5 * * * *", "2-59/10 * * * *"]

# briefing archive (Daily / Evening / Weekly / Monthly editions) + staged inputs of scheduled runs
[[kv_namespaces]]
binding = "BRIEFS"
id = "96055847b5bc43aeb3d57eb5a15abcb3"

[vars]
ALLOWED_ORIGIN = "https://alessandrozanichelli.com"
# Cloudflare Access (Zero Trust): the Worker re-checks the Access JWT on every /api request.
# Not secrets: the team domain and the application's audience tag only identify which tokens to accept.
ACCESS_TEAM_DOMAIN = "bitter-sunset-0b31.cloudflareaccess.com"
ACCESS_AUD = "665e1b22b9f9c6fd946766bc604fcd5e87731182535777b75f835d297666552a"

# TWELVEDATA_KEY is a SECRET (Cloudflare dashboard → Worker → Settings →
# Variables and Secrets, type "Secret"), never committed to this repo.
# Optional, same place, type "Secret": TELEGRAM_BOT_TOKEN (the bot that sends alerts; the chat is linked
# from ALRT) and TELEGRAM_CHAT_ID (only if the chat is not linked from ALRT).
